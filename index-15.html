<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1b1a">
<title>Bar SKT Takip</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192-3.png">
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#1c1b1a;--mute:#6f6b64;--line:#e3ded4;--ok:#2e7d32;--warn:#e0a100;--bad:#c62828;--acc:#1c1b1a;--accT:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#161514;--card:#232220;--text:#f1eee8;--mute:#9a958c;--line:#35332f;--ok:#66bb6a;--warn:#ffc107;--bad:#ef5350;--acc:#f1eee8;--accT:#161514}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));max-width:640px;margin-inline:auto}
h1{font-size:22px;margin:4px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sum{display:flex;gap:8px;margin-bottom:12px}
.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sum b{display:block;font-size:22px}.sum small{color:var(--mute)}
form,.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;margin-bottom:12px}
label{font-size:12px;color:var(--mute);display:block}
input,select,button{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr auto;gap:8px}
button{cursor:pointer}button.p{background:var(--acc);color:var(--accT);border:0;font-weight:600}
button.s{width:auto;padding:6px 10px;font-size:13px}button.d{color:var(--bad)}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.item.warn{border-left-color:var(--warn)}.item.bad{border-left-color:var(--bad)}
.item .n{font-weight:600}.item .m{font-size:13px;color:var(--mute)}
.tag{font-size:12px;font-weight:700}.warn .tag{color:var(--warn)}.bad .tag{color:var(--bad)}.ok .tag{color:var(--ok)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.empty{text-align:center;color:var(--mute);padding:24px}
#st{font-size:12px;color:var(--mute);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip i{font-style:normal;color:var(--bad);cursor:pointer}
details summary{cursor:pointer;font-weight:600}
#login{text-align:center;padding:60px 0}
#scan{position:fixed;inset:0;background:#000;z-index:9;display:none;flex-direction:column;padding:16px;gap:12px;color:#fff}
#reader{flex:1;min-height:0}
#bc{font-size:13px;color:var(--mute)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<div id="login" style="display:none;max-width:320px;margin:40px auto;text-align:center">
  <h1>🍸 Bar SKT Takip</h1>
  <p id="lmsg" style="color:var(--mute)">Kullanıcı adı ve şifrenizle giriş yapın.</p>
  <form id="lf" style="text-align:left"><input id="lu" placeholder="Kullanıcı adı" autocapitalize="none" autocomplete="username" required>
  <input id="lp" type="password" placeholder="Şifre" autocomplete="current-password" required>
  <button class="p" type="submit">Giriş</button></form>
  <button id="lbtn" style="margin-top:16px;background:none;border:0;color:var(--mute);font-size:13px">Yönetici girişi (Google)</button>
</div>

<div id="app" style="display:none">
<div class="top"><h1>🍸 Bar SKT Takip</h1><div style="display:flex;gap:6px"><button class="s p" id="xl">⬇ Excel</button><button class="s" id="out">Çıkış</button></div></div>
<div id="st">Bağlanıyor…</div>
<div class="sum">
  <div><b id="cBad" style="color:var(--bad)">0</b><small>Geçti/Bugün</small></div>
  <div><b id="cWarn" style="color:var(--warn)">0</b><small>3 gün içinde</small></div>
  <div><b id="cOk" style="color:var(--ok)">0</b><small>Güvenli</small></div>
</div>
<form id="f">
  <b id="ft">Yeni ürün ekle</b>
  <button type="button" class="p" id="scanBtn">📷 Barkod okut</button>
  <div id="bc"></div>
  <div><label>Ürün adı</label><input id="name" required placeholder="Örn. Şeker şurubu"></div>
  <div class="row">
    <div><label>Grup</label><select id="cat"></select></div>
    <div><label>Adet</label><input id="qty" type="number" min="1" value="1"></div>
  </div>
  <div class="row">
    <div><label>Açılış tarihi (ops.)</label><input id="opened" type="date"></div>
    <div><label>Kullanım süresi (gün, ops.)</label><input id="life" type="number" min="1"></div>
  </div>
  <div><label>SKT (son kullanma tarihi)</label><input id="skt" type="date"></div>
  <div class="row"><button class="p" type="submit" id="sub">Ekle</button><button type="button" id="cancel" style="display:none">Vazgeç</button></div>
</form>
<details class="box"><summary>Grupları yönet</summary>
  <div class="row3"><input id="gname" placeholder="Yeni grup adı"><button type="button" class="s p" id="gadd">Ekle</button></div>
  <div class="chips" id="chips"></div>
</details>
<details class="box" id="staffBox" style="display:none"><summary>Personeli yönet (yönetici)</summary>
  <input id="sn" placeholder="Personel adı (örn. Ahmet Y.)">
  <input id="su" placeholder="Kullanıcı adı (küçük harf/rakam, örn. ahmet)" autocapitalize="none">
  <input id="sp" type="text" placeholder="Şifre (en az 6 karakter)">
  <button type="button" class="p" id="sadd">Personel ekle</button>
  <div id="slist"></div>
</details>
<div class="row" style="margin-bottom:10px">
  <select id="filter"><option value="all">Tüm durumlar</option><option value="bad">Geçti/Bugün</option><option value="warn">3 gün içinde</option></select>
  <select id="gfilter"></select>
</div>
<div id="list"></div>
</div>

<div id="scan"><b>Barkodu kameraya tutun</b><div id="reader"></div><button id="scanX">Kapat</button></div>

<script type="module">
// ====== BURAYI DOLDURUN (Firebase > Proje ayarları > Web uygulaması) ======
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDVZbP_LYbYVtmDPIR3mfQqEYs20QBLylU",
  authDomain: "bar-skt-takip.firebaseapp.com",
  projectId: "bar-skt-takip",
  storageBucket: "bar-skt-takip.firebasestorage.app",
  messagingSenderId: "667981178516",
  appId: "1:667981178516:web:3618e7e73f31e924d33681"
};
// ==========================================================================
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,getDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $=id=>document.getElementById(id);
const fb=initializeApp(FIREBASE_CONFIG),auth=getAuth(fb),db=getFirestore(fb);
const DEFAULT_GROUPS=['Şurup','Süt/Krema','Meyve/Sebze','Açılmış şişe','Fıçı bira','Diğer'];
const DOMAIN='@bar-skt.app';let isAdmin=false,staffName='',staffList=[];
let items=[],groups=[],logs=[],me=null,editId=null,barcode='',unsubs=[],scanner=null;
const DAY=864e5,today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=d=>d.toLocaleDateString('tr-TR');
const who=()=>staffName||(me?(me.displayName||me.email||''):'');
const err=e=>{$('st').textContent=e.code==='permission-denied'?'Bu hesabın yetkisi yok (e-posta kurallarda ekli mi?)':'Hata: '+(e.message||e.code)};
const allGroups=()=>[...DEFAULT_GROUPS,...groups.map(g=>g.name).filter(n=>!DEFAULT_GROUPS.includes(n))];

function effDate(it){const c=[];if(it.skt)c.push(pd(it.skt));
  if(it.opened&&it.life){const d=pd(it.opened);d.setDate(d.getDate()+Number(it.life));c.push(d)}
  return c.length?new Date(Math.min(...c)):null}
function status(it){const e=effDate(it);if(!e)return{k:'ok',t:'Tarih yok',d:9999};
  const d=Math.round((e-today())/DAY);
  if(d<0)return{k:'bad',t:Math.abs(d)+' gün geçti',d};
  if(d===0)return{k:'bad',t:'BUGÜN',d};
  if(d<=3)return{k:'warn',t:d+' gün kaldı',d};
  return{k:'ok',t:d+' gün kaldı',d}}

function fillGroups(){
  const g=allGroups(),cur=$('cat').value,gf=$('gfilter').value||'all';
  const opt=(sel,v,t)=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o)};
  $('cat').textContent='';g.forEach(n=>opt($('cat'),n,n));if(g.includes(cur))$('cat').value=cur;
  $('gfilter').textContent='';opt($('gfilter'),'all','Tüm gruplar');g.forEach(n=>opt($('gfilter'),n,n));
  $('gfilter').value=g.includes(gf)?gf:'all';
  const C=$('chips');C.textContent='';
  groups.forEach(gr=>{const c=document.createElement('span');c.className='chip';c.textContent=gr.name;
    const x=document.createElement('i');x.textContent='✕';
    x.onclick=async()=>{
      if(items.some(i=>i.cat===gr.name)){alert('Bu grupta ürün var. Önce taşıyın veya silin.');return}
      if(confirm('"'+gr.name+'" grubu silinsin mi?'))try{await deleteDoc(doc(db,'groups',gr.id))}catch(e){err(e)}};
    c.appendChild(x);C.appendChild(c)});
}
function render(){
  const rows=items.map(i=>({i,s:status(i)})).sort((a,b)=>a.s.d-b.s.d);
  $('cBad').textContent=rows.filter(r=>r.s.k==='bad').length;
  $('cWarn').textContent=rows.filter(r=>r.s.k==='warn').length;
  $('cOk').textContent=rows.filter(r=>r.s.k==='ok').length;
  const f=$('filter').value,gf=$('gfilter').value||'all';
  const v=rows.filter(r=>(f==='all'||r.s.k===f)&&(gf==='all'||r.i.cat===gf));
  const L=$('list');L.textContent='';
  if(!v.length){const e=document.createElement('div');e.className='empty';e.textContent='Kayıt yok.';L.appendChild(e);return}
  v.forEach(({i,s})=>{
    const e=effDate(i),el=document.createElement('div');el.className='item '+s.k;
    const l=document.createElement('div');
    const n=document.createElement('div');n.className='n';n.textContent=i.name+' ×'+i.qty;
    const m=document.createElement('div');m.className='m';m.textContent=i.cat+(e?' · SKT: '+fmt(e):'')+(i.by?' · '+i.by:'');
    const t=document.createElement('div');t.className='tag';t.textContent=s.t;
    l.append(n,m,t);
    const a=document.createElement('div');a.className='acts';
    const mk=(x,fn,c)=>{const b=document.createElement('button');b.className='s '+(c||'');b.textContent=x;b.onclick=fn;return b};
    a.append(mk('Düzenle',()=>startEdit(i)),mk('Sil',()=>del(i),'d'),mk('Kullanıldı',()=>retire(i,'kullanıldı')),mk('Fire',()=>retire(i,'fire')));
    el.append(l,a);L.appendChild(el)});
}
function startEdit(i){editId=i.id;barcode=i.barcode||'';$('bc').textContent=barcode?'Barkod: '+barcode:'';
  $('name').value=i.name;$('cat').value=i.cat;$('qty').value=i.qty;$('opened').value=i.opened||'';$('life').value=i.life||'';$('skt').value=i.skt||'';
  $('ft').textContent='Ürünü düzenle';$('sub').textContent='Güncelle';$('cancel').style.display='';$('f').scrollIntoView({behavior:'smooth'})}
function resetForm(){editId=null;barcode='';$('bc').textContent='';$('f').reset();$('qty').value=1;
  $('ft').textContent='Yeni ürün ekle';$('sub').textContent='Ekle';$('cancel').style.display='none'}
$('cancel').onclick=resetForm;
async function del(it){if(!confirm('"'+it.name+'" tamamen silinsin mi? (Kayıt tutulmaz)'))return;
  try{await deleteDoc(doc(db,'items',it.id));if(editId===it.id)resetForm()}catch(e){err(e)}}
async function retire(it,reason){
  if(reason==='fire'&&!confirm('Fire (atık) olarak kaydedilsin mi?'))return;
  try{await addDoc(collection(db,'log'),{name:it.name,cat:it.cat,qty:it.qty,reason,at:Date.now(),by:who()});
    await deleteDoc(doc(db,'items',it.id));if(editId===it.id)resetForm()}catch(e){err(e)}}
$('f').onsubmit=async ev=>{ev.preventDefault();
  const rec={name:$('name').value.trim(),cat:$('cat').value,qty:Number($('qty').value)||1,
    opened:$('opened').value||'',life:$('life').value||'',skt:$('skt').value||'',barcode};
  try{
    if(editId)await updateDoc(doc(db,'items',editId),rec);
    else await addDoc(collection(db,'items'),{...rec,added:Date.now(),by:who()});
    if(barcode)await setDoc(doc(db,'barcodes',barcode),{name:rec.name,cat:rec.cat});
    resetForm();
  }catch(e){err(e)}};
$('gadd').onclick=async()=>{const n=$('gname').value.trim();if(!n)return;
  if(allGroups().some(g=>g.toLowerCase()===n.toLowerCase())){alert('Bu grup zaten var.');return}
  try{await addDoc(collection(db,'groups'),{name:n});$('gname').value=''}catch(e){err(e)}};
$('xl').onclick=()=>{
  const rows=items.map(i=>({i,s:status(i)})).sort((a,b)=>a.s.d-b.s.d).map(({i,s})=>{const e=effDate(i);
    return{'Ürün':i.name,'Grup':i.cat,'Adet':i.qty,'Barkod':i.barcode||'','Açılış Tarihi':i.opened||'','Kullanım Süresi (gün)':i.life||'','SKT':i.skt||'','Geçerli Son Tarih':e?fmt(e):'','Durum':s.t,'Ekleyen':i.by||''}});
  const lg=[...logs].sort((a,b)=>b.at-a.at).map(l=>({'Tarih':new Date(l.at).toLocaleString('tr-TR'),'Ürün':l.name,'Grup':l.cat,'Adet':l.qty,'Neden':l.reason,'İşlemi yapan':l.by||''}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Ürünler');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(lg),'Kullanım-Fire Kayıtları');
  XLSX.writeFile(wb,'skt-takip-'+new Date().toISOString().slice(0,10)+'.xlsx')};
$('filter').onchange=render;$('gfilter').onchange=render;

// ---- Barkod ----
async function lookup(code){
  barcode=code;$('bc').textContent='Barkod: '+code+' · aranıyor…';
  try{const s=await getDoc(doc(db,'barcodes',code));
    if(s.exists()){const d=s.data();$('name').value=d.name;if(allGroups().includes(d.cat))$('cat').value=d.cat;
      $('bc').textContent='Barkod: '+code+' · kayıtlı ürün bulundu';$('skt').focus();return}}catch(e){}
  try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,brands');
    const j=await r.json();
    if(j.status===1&&j.product&&(j.product.product_name||j.product.brands)){
      $('name').value=[j.product.brands&&j.product.brands.split(',')[0],j.product.product_name].filter(Boolean).join(' ');
      $('bc').textContent='Barkod: '+code+' · ürün bulundu, kontrol edin';$('skt').focus();return}}catch(e){}
  $('bc').textContent='Barkod: '+code+' · ürün bulunamadı, adını yazın (bir sonraki sefer hatırlanır)';$('name').focus();
}
async function stopScan(){$('scan').style.display='none';if(scanner){try{await scanner.stop();scanner.clear()}catch(e){}scanner=null}}
$('scanBtn').onclick=async()=>{
  if(typeof Html5Qrcode==='undefined'){alert('Barkod kütüphanesi yüklenemedi.');return}
  $('scan').style.display='flex';
  scanner=new Html5Qrcode('reader',{experimentalFeatures:{useBarCodeDetector:true}});
  try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:160}},async code=>{await stopScan();lookup(code)},()=>{})}
  catch(e){await stopScan();alert('Kamera açılamadı. Tarayıcıda kamera iznini verin.')}};
$('scanX').onclick=stopScan;

// ---- Giriş ----
const prov=new GoogleAuthProvider();
$('lbtn').onclick=async()=>{try{await signInWithPopup(auth,prov)}catch(e){
  if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')signInWithRedirect(auth,prov);
  else $('lmsg').textContent='Giriş hatası: '+(e.code||e.message)}};
$('lf').onsubmit=async ev=>{ev.preventDefault();
  try{await signInWithEmailAndPassword(auth,$('lu').value.trim().toLowerCase()+DOMAIN,$('lp').value)}
  catch(e){$('lmsg').textContent=(e.code==='auth/invalid-credential'||e.code==='auth/user-not-found'||e.code==='auth/wrong-password')?'Kullanıcı adı veya şifre hatalı.':'Giriş hatası: '+(e.code||e.message)}};
$('out').onclick=()=>signOut(auth);

// ---- Personel yönetimi (yönetici) ----
function renderStaff(){const L=$('slist');L.textContent='';
  if(!staffList.length){const e=document.createElement('div');e.className='m';e.style.color='var(--mute)';e.textContent='Henüz personel yok.';L.appendChild(e);return}
  staffList.forEach(st=>{const r=document.createElement('div');r.className='row3';r.style.alignItems='center';
    const t=document.createElement('span');t.textContent=st.name+' ('+st.username+')';
    const b=document.createElement('button');b.className='s d';b.textContent='Sil';
    b.onclick=async()=>{if(confirm(st.name+' erişimi kapatılsın mı?'))try{await deleteDoc(doc(db,'staff',st.id))}catch(e){err(e)}};
    r.append(t,b);L.appendChild(r)})}
$('sadd').onclick=async()=>{
  const name=$('sn').value.trim(),un=$('su').value.trim().toLowerCase(),pw=$('sp').value;
  if(!name||!/^[a-z0-9._-]{3,}$/.test(un)){alert('Ad yazın; kullanıcı adı en az 3 karakter, sadece küçük harf, rakam, . _ - olabilir.');return}
  if(pw.length<6){alert('Şifre en az 6 karakter olmalı.');return}
  try{
    const sec=initializeApp(FIREBASE_CONFIG,'sec'+Date.now()),sa=getAuth(sec);
    const c=await createUserWithEmailAndPassword(sa,un+DOMAIN,pw);
    await setDoc(doc(db,'staff',c.user.uid),{name,username:un,at:Date.now()});
    await signOut(sa);
    $('sn').value=$('su').value=$('sp').value='';alert(name+' eklendi. Kullanıcı adı: '+un+' · Şifre: '+pw);
  }catch(e){alert(e.code==='auth/email-already-in-use'?'Bu kullanıcı adı kullanılmış (silinmiş olsa bile). Başka bir ad deneyin.':'Hata: '+(e.code||e.message))}};

function sub(name,fn){return onSnapshot(collection(db,name),s=>fn(s.docs.map(d=>({id:d.id,...d.data()}))),err)}
onAuthStateChanged(auth,async u=>{
  me=u;unsubs.forEach(f=>f());unsubs=[];isAdmin=false;staffName='';
  if(u){
    isAdmin=!!u.email&&!u.email.endsWith(DOMAIN);
    if(!isAdmin){
      try{const s=await getDoc(doc(db,'staff',u.uid));
        if(!s.exists()){await signOut(auth);$('lmsg').textContent='Bu hesabın erişimi kapatılmış. Yöneticiye başvurun.';return}
        staffName=s.data().name}catch(e){await signOut(auth);return}
    }
  }
  $('login').style.display=u?'none':'block';$('app').style.display=u?'block':'none';
  $('staffBox').style.display=isAdmin?'':'none';
  if(!u)return;
  fillGroups();render();
  unsubs=[sub('items',a=>{items=a;$('st').textContent='Canlı · '+who()+(isAdmin?' (yönetici)':'');render()}),
    sub('groups',a=>{groups=a;fillGroups();render()}),sub('log',a=>{logs=a})];
  if(isAdmin)unsubs.push(sub('staff',a=>{staffList=a;renderStaff()}));
});
</script>
</body>
</html>
