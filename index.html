<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0a1a">
<title>Bar SKT Takip</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192-3.png">
<style>
:root{--bg:#0e0a1a;--card:rgba(255,255,255,.065);--field:rgba(255,255,255,.08);--text:#f5f2ff;--mute:#a9a1c8;--line:rgba(255,255,255,.13);
--ok:#2ee6a6;--warn:#ffc83d;--bad:#ff5273;--none:#9a93bb;--p1:#ff5e8a;--p2:#ff9f43;--c1:#22d3ee;--c2:#7c5cff;--acc:#f5f2ff;--accT:#1a1030;
--glow1:rgba(255,94,138,.30);--glow2:rgba(124,92,255,.32)}
@media (prefers-color-scheme:light){:root{--bg:#fff6f1;--card:#ffffff;--field:#f6eefa;--text:#2a1a3a;--mute:#7b6c92;--line:rgba(70,30,100,.14);
--ok:#0c9b6b;--warn:#c58a00;--bad:#e0264d;--none:#8a7fa3;--acc:#2a1a3a;--accT:#ffffff;--glow1:rgba(255,94,138,.22);--glow2:rgba(124,92,255,.20)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--text);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;max-width:640px;margin-inline:auto;
padding:max(16px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom));
background:radial-gradient(800px 480px at 0% -8%,var(--glow1),transparent 62%),radial-gradient(720px 520px at 100% 0%,var(--glow2),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
h1{font-size:18px;white-space:nowrap;padding-right:3px;margin:0;font-weight:800;letter-spacing:.2px;background:linear-gradient(90deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:42px;height:42px;border-radius:14px;object-fit:cover;box-shadow:0 4px 16px rgba(255,94,138,.35);border:2px solid rgba(255,255,255,.2)}
.hb{display:flex;gap:6px;flex:none}.hb button{white-space:nowrap}
.row:has(#cancel[style*="none"]) #sub{grid-column:1/-1}
#st{font-size:12px;color:var(--mute);margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sum .t{position:relative;border-radius:16px;padding:10px 4px 9px;text-align:center;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:transform .15s,box-shadow .15s}
.sum .t i{font-style:normal;font-size:17px;display:block;line-height:1}
.sum .t b{display:block;font-size:24px;font-weight:800;line-height:1.15;margin-top:3px}
.sum .t small{display:block;font-size:10.5px;color:var(--mute);line-height:1.2}
.sum .bad{background:linear-gradient(160deg,rgba(255,82,115,.24),rgba(255,82,115,.05))}.sum .bad b{color:var(--bad)}
.sum .warn{background:linear-gradient(160deg,rgba(255,200,61,.24),rgba(255,200,61,.05))}.sum .warn b{color:var(--warn)}
.sum .ok{background:linear-gradient(160deg,rgba(46,230,166,.22),rgba(46,230,166,.05))}.sum .ok b{color:var(--ok)}
.sum .none{background:linear-gradient(160deg,rgba(154,147,187,.22),rgba(154,147,187,.05))}.sum .none b{color:var(--none)}
.sum .t.on{transform:translateY(-2px);box-shadow:0 0 0 2px var(--p1),0 8px 20px rgba(255,94,138,.28)}
form,.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:10px;margin-bottom:14px;backdrop-filter:blur(8px)}
#ft{font-size:17px;font-weight:800}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px;font-weight:600}
input,select,button{font:inherit;width:100%;padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(255,94,138,.22)}
select option{background:#1a1030;color:#f5f2ff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr auto;gap:8px}
button{cursor:pointer;font-weight:600;transition:transform .12s,filter .12s}
button:active{transform:scale(.97)}
button.p{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:0;font-weight:800;box-shadow:0 8px 20px rgba(255,94,138,.35)}
#photoBtn{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border:0;font-size:16px;font-weight:800;padding:15px;box-shadow:0 8px 22px rgba(124,92,255,.38)}
#scanBtn{background:transparent;border:1.5px dashed var(--line);color:var(--text)}
#sub{font-size:16px;padding:14px}
button.s{width:auto;padding:8px 13px;font-size:13px;border-radius:999px}
button.d{color:var(--bad);background:rgba(255,82,115,.14);border-color:rgba(255,82,115,.35)}
button.cam{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border:0;font-weight:700}
button.good{color:var(--ok);background:rgba(46,230,166,.13);border-color:rgba(46,230,166,.35)}
button.fire{color:var(--p2);background:rgba(255,159,67,.14);border-color:rgba(255,159,67,.38)}
.item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:10px;backdrop-filter:blur(8px)}
.item .top2{display:flex;align-items:center;gap:11px}
.item .ic{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:rgba(154,147,187,.2)}
.item.ok .ic{background:rgba(46,230,166,.2)}.item.warn .ic{background:rgba(255,200,61,.22)}.item.bad .ic{background:rgba(255,82,115,.24)}
.item .info{flex:1;min-width:0}
.item .n{font-weight:700;font-size:15.5px;line-height:1.25;word-break:break-word}
.item .m{font-size:12.5px;color:var(--mute);margin-top:2px}
.tag{flex:none;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap;background:rgba(154,147,187,.2);color:var(--none)}
.ok .tag{background:rgba(46,230,166,.18);color:var(--ok)}.warn .tag{background:rgba(255,200,61,.2);color:var(--warn)}.bad .tag{background:rgba(255,82,115,.22);color:var(--bad)}
.item.bad{border-color:rgba(255,82,115,.45);box-shadow:0 0 0 1px rgba(255,82,115,.15),0 6px 22px rgba(255,82,115,.12)}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;align-items:center}
label.dp{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px;font-weight:600}
label.dp input{width:auto;padding:5px 8px;border-radius:999px;font-size:13px;border:0;background:rgba(255,255,255,.08)}
.empty{text-align:center;color:var(--mute);padding:28px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--field);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;display:flex;gap:7px;align-items:center}
.chip i{font-style:normal;color:var(--bad);cursor:pointer}
details.box summary{cursor:pointer;font-weight:800;font-size:15px;list-style:none}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸ ";color:var(--p1)}details.box[open] summary::before{content:"▾ "}
#login{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 20px;backdrop-filter:blur(8px)}
#login .logo{width:84px;height:84px;border-radius:24px;margin:0 auto 10px;display:block}
#login h1{font-size:26px}
#login form{background:none;border:0;padding:0;margin:14px 0 0;backdrop-filter:none}
#scan{position:fixed;inset:0;background:#000;z-index:9;display:none;flex-direction:column;padding:16px;gap:12px;color:#fff}
#reader{flex:1;min-height:0}
#bc{font-size:13px;color:var(--mute)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.hrow .n{font-weight:700;font-size:14.5px}.hrow .m{font-size:12px;color:var(--mute)}
#toast{position:fixed;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));background:linear-gradient(135deg,#2a1a4a,#1a1030);color:#fff;border:1px solid rgba(255,255,255,.2);padding:13px 14px;border-radius:16px;z-index:20;display:none;font-size:14px;align-items:center;gap:10px;justify-content:space-between;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast button{width:auto;padding:7px 12px;font-size:13px;white-space:nowrap;border-radius:999px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border:0}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<div id="login" style="display:none;max-width:340px;margin:40px auto;text-align:center">
  <img class="logo" src="icon-192-3.png" alt="" onerror="this.style.display='none'">
  <h1>Bar SKT Takip</h1>
  <p id="lmsg" style="color:var(--mute)">Kullanıcı adı ve şifrenizle giriş yapın.</p>
  <form id="lf" style="text-align:left"><input id="lu" placeholder="Kullanıcı adı" autocapitalize="none" autocomplete="username" required>
  <input id="lp" type="password" placeholder="Şifre" autocomplete="current-password" required>
  <button class="p" type="submit">Giriş</button></form>
  <button id="lbtn" style="margin-top:16px;background:none;border:0;color:var(--mute);font-size:13px">Yönetici girişi (Google)</button>
</div>

<div id="app" style="display:none">
<div class="top"><div class="brand"><img class="logo" src="icon-192-3.png" alt="" onerror="this.style.display='none'"><div style="min-width:0"><h1>Bar SKT Takip</h1><div id="st">Bağlanıyor…</div></div></div><div class="hb"><button class="s p" id="xl">⬇ Excel</button><button class="s" id="out">Çıkış</button></div></div>
<div class="sum">
  <div class="t bad" data-f="bad"><i>🔥</i><b id="cBad">0</b><small>Geçti / bugün</small></div>
  <div class="t warn" data-f="warn"><i>⏳</i><b id="cWarn">0</b><small>3 gün içinde</small></div>
  <div class="t ok" data-f="ok"><i>✅</i><b id="cOk">0</b><small>Güvenli</small></div>
  <div class="t none" data-f="none"><i>📝</i><b id="cNone">0</b><small>SKT yok</small></div>
</div>
<form id="f">
  <b id="ft">Yeni ürün ekle</b>
  <button type="button" class="p" id="photoBtn">📸 Etiketi fotoğrafla (otomatik oku)</button>
  <input type="file" id="photoIn" accept="image/*" capture="environment" style="display:none">
  <button type="button" id="scanBtn">📷 Barkod okut</button>
  <div id="bc"></div>
  <div><label>Ürün adı</label><input id="name" required placeholder="Örn. Şeker şurubu"></div>
  <div class="row">
    <div><label>Grup</label><select id="cat"></select></div>
    <div><label>Adet</label><input id="qty" type="number" min="1" value="1"></div>
  </div>
  <div><label>SKT (son kullanma tarihi)</label><input id="skt" type="date"></div>
  <div class="row"><button class="p" type="submit" id="sub">Ekle</button><button type="button" id="cancel" style="display:none">Vazgeç</button></div>
</form>
<details class="box"><summary>Grupları yönet</summary>
  <div class="row3"><input id="gname" placeholder="Yeni grup adı"><button type="button" class="s p" id="gadd">Ekle</button></div>
  <div class="chips" id="chips"></div>
</details>
<details class="box" id="staffBox" style="display:none"><summary>Yönetim (yönetici)</summary>
  <button type="button" class="s" id="imp">📥 Sayım listesindeki bar ürünlerini içe aktar (209)</button>
  <input id="sn" placeholder="Personel adı (örn. Ahmet Y.)">
  <input id="su" placeholder="Kullanıcı adı (küçük harf/rakam, örn. ahmet)" autocapitalize="none">
  <input id="sp" type="text" placeholder="Şifre (en az 6 karakter)">
  <button type="button" class="p" id="sadd">Personel ekle</button>
  <button type="button" class="s" id="diag">🔍 Yapay zeka bağlantı testi</button>
  <pre id="diagOut" style="white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--mute);margin:0"></pre>
  <div id="slist"></div>
</details>
<details class="box" id="histBox"><summary>🕘 Geçmiş: kullanılan / fire <span id="histN" style="color:var(--mute);font-weight:600"></span></summary>
  <div class="row"><select id="hf"><option value="all">Hepsi</option><option value="kullanıldı">Kullanıldı</option><option value="fire">Fire</option></select><input id="hq" placeholder="🔍 Ara"></div>
  <button type="button" class="s good" id="hall" style="display:none"></button>
  <div id="hist"></div>
</details>
<div class="row" style="margin-bottom:10px">
  <select id="filter"><option value="all">Tüm durumlar</option><option value="bad">Geçti/Bugün</option><option value="warn">3 gün içinde</option><option value="ok">Güvenli</option><option value="none">SKT girilmemiş</option></select>
  <select id="gfilter"></select>
</div>
<input id="q" placeholder="🔍 Ürün ara" style="margin-bottom:10px">
<div id="list"></div>
</div>

<div id="toast"></div>
<input type="file" id="itemPhotoIn" accept="image/*" capture="environment" style="display:none">
<div id="scan"><b>Barkodu kameraya tutun</b><div id="reader"></div><button id="scanX">Kapat</button></div>

<script type="module">
// ====== BURAYI DOLDURUN (Firebase > Proje ayarları > Web uygulaması) ======
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDVZbP_LYbYVtmDPIR3mfQqEYs20QBLylU",
  authDomain: "bar-skt-takip.firebaseapp.com",
  projectId: "bar-skt-takip",
  storageBucket: "bar-skt-takip.firebasestorage.app",
  messagingSenderId: "667981178516",
  appId: "1:667981178516:web:3618e7e73f31e924d33681"
};
// ==========================================================================
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {initializeAppCheck,getToken as getAppCheckToken,ReCaptchaEnterpriseProvider} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app-check.js";
import {getAI,getGenerativeModel,GoogleAIBackend} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-ai.js";
import {getFirestore,writeBatch,collection,doc,addDoc,setDoc,getDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const $=id=>document.getElementById(id);
const fb=initializeApp(FIREBASE_CONFIG);
// App Check (Firebase AI Logic için zorunlu). Bu anahtar Firebase > App Check > Apps > Manage debug tokens bölümüne eklenmelidir.
const APPCHECK_DEBUG_TOKEN="62c27f1e-0f60-48b7-b076-902db9c50634";
self.FIREBASE_APPCHECK_DEBUG_TOKEN=APPCHECK_DEBUG_TOKEN;
let appCheck=null,appCheckErr='';
try{appCheck=initializeAppCheck(fb,{provider:new ReCaptchaEnterpriseProvider('debug-only'),isTokenAutoRefreshEnabled:true})}catch(e){appCheckErr=String(e&&e.message||e);console.warn('AppCheck',e)}
const auth=getAuth(fb),db=getFirestore(fb),ai=getAI(fb,{backend:new GoogleAIBackend()});
const DEFAULT_GROUPS=['Bira','Şarap','Rakı','Sert İçki','Likör & Vermut','Easymix','Şurup','Püre','Çay & Kahve','Alkolsüz İçecek','Süt/Krema','Meyve/Sebze','Açılmış şişe','Fıçı bira','Diğer'];
const DOMAIN='@bar-skt.app';let isAdmin=false,staffName='',staffList=[];
let photoMatch=null,targetItem=null,targetMode='set',toastT=null;
let items=[],groups=[],logs=[],me=null,editId=null,barcode='',unsubs=[],scanner=null;
const DAY=864e5,today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=d=>d.toLocaleDateString('tr-TR');
const who=()=>staffName||(me?(me.displayName||me.email||''):'');
const err=e=>{$('st').textContent=e.code==='permission-denied'?'Bu hesabın yetkisi yok (e-posta kurallarda ekli mi?)':'Hata: '+(e.message||e.code)};
const allGroups=()=>[...DEFAULT_GROUPS,...groups.map(g=>g.name).filter(n=>!DEFAULT_GROUPS.includes(n))];

function effDate(it){return it.skt?pd(it.skt):null}
function status(it){const e=effDate(it);if(!e)return{k:'none',t:'SKT girilmedi',d:99998};
  const d=Math.round((e-today())/DAY);
  if(d<0)return{k:'bad',t:Math.abs(d)+' gün geçti',d};
  if(d===0)return{k:'bad',t:'BUGÜN',d};
  if(d<=3)return{k:'warn',t:d+' gün kaldı',d};
  return{k:'ok',t:d+' gün kaldı',d}}
const norm=s=>String(s||'').toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i');

function fillGroups(){
  const g=allGroups(),cur=$('cat').value,gf=$('gfilter').value||'all';
  const opt=(sel,v,t)=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o)};
  $('cat').textContent='';g.forEach(n=>opt($('cat'),n,n));if(g.includes(cur))$('cat').value=cur;
  $('gfilter').textContent='';opt($('gfilter'),'all','Tüm gruplar');g.forEach(n=>opt($('gfilter'),n,n));
  $('gfilter').value=g.includes(gf)?gf:'all';
  const C=$('chips');C.textContent='';
  groups.forEach(gr=>{const c=document.createElement('span');c.className='chip';c.textContent=gr.name;
    const x=document.createElement('i');x.textContent='✕';
    x.onclick=async()=>{
      if(items.some(i=>i.cat===gr.name)){alert('Bu grupta ürün var. Önce taşıyın veya silin.');return}
      if(confirm('"'+gr.name+'" grubu silinsin mi?'))try{await deleteDoc(doc(db,'groups',gr.id))}catch(e){err(e)}};
    c.appendChild(x);C.appendChild(c)});
}
const GEMOJI={'Bira':'🍺','Şarap':'🍷','Rakı':'🍶','Sert İçki':'🥃','Likör & Vermut':'🍸','Easymix':'🍹','Şurup':'🍯','Püre':'🍓','Çay & Kahve':'☕','Alkolsüz İçecek':'🥤','Süt/Krema':'🥛','Meyve/Sebze':'🍋','Açılmış şişe':'🍾','Fıçı bira':'🍻','Diğer':'📦'};
function render(){
  const rows=items.map(i=>({i,s:status(i)})).sort((a,b)=>a.s.d-b.s.d||String(a.i.name).localeCompare(String(b.i.name),'tr'));
  const cnt=k=>rows.filter(r=>r.s.k===k).length;
  $('cBad').textContent=cnt('bad');$('cWarn').textContent=cnt('warn');$('cOk').textContent=cnt('ok');$('cNone').textContent=cnt('none');
  const f=$('filter').value,gf=$('gfilter').value||'all',q=norm($('q').value.trim());
  const v=rows.filter(r=>(f==='all'||r.s.k===f)&&(gf==='all'||r.i.cat===gf)&&(!q||norm(r.i.name).includes(q)));
  const L=$('list');L.textContent='';
  if(!v.length){const e=document.createElement('div');e.className='empty';e.textContent='Kayıt yok.';L.appendChild(e);return}
  v.forEach(({i,s})=>{
    const e=effDate(i),el=document.createElement('div');el.className='item '+s.k;
    const ic=document.createElement('div');ic.className='ic';ic.textContent=GEMOJI[i.cat]||'🍸';
    const info=document.createElement('div');info.className='info';
    const n=document.createElement('div');n.className='n';n.textContent=i.name+(i.qty>1?' ×'+i.qty:'');
    const m=document.createElement('div');m.className='m';
    m.textContent=i.cat+(e?' · SKT '+fmt(e):'')+(i.by&&i.by!=='Liste aktarımı'&&i.by!=='Sayım listesi'?' · '+i.by:'');
    info.append(n,m);
    const t=document.createElement('div');t.className='tag';t.textContent=s.t;
    const top=document.createElement('div');top.className='top2';top.append(ic,info,t);
    const a=document.createElement('div');a.className='acts';
    const mk=(x,fn,c)=>{const b=document.createElement('button');b.type='button';b.className='s '+(c||'');b.textContent=x;b.onclick=fn;return b};
    if(s.k==='none'){const inp=document.createElement('input');inp.type='date';inp.title='SKT gir';
      inp.onchange=async()=>{if(inp.value)try{await updateDoc(doc(db,'items',i.id),{skt:inp.value})}catch(x){err(x)}};
      const lab=document.createElement('label');lab.className='dp';lab.append('📅 SKT gir',inp);a.appendChild(lab)}
    a.append(mk('📷 SKT çek',()=>itemPhoto(i),'cam'),mk('➕ Yeni parti',()=>itemPhoto(i,'new')),mk('Düzenle',()=>startEdit(i)),mk('Kullanıldı',()=>retire(i,'kullanıldı'),'good'),mk('Fire',()=>retire(i,'fire'),'fire'),mk('Sil',()=>del(i),'d'));

const snap=it=>{const {id,...d}=it;return d};
async function del(it){if(!confirm('"'+it.name+'" tamamen silinsin mi? (Kayıt tutulmaz)'))return;
  try{const d=snap(it);await deleteDoc(doc(db,'items',it.id));if(editId===it.id)resetForm();
    toast('🗑 '+it.name+' silindi',()=>setDoc(doc(db,'items',it.id),d),12000)}catch(e){err(e)}}
async function retire(it,reason){
  if(reason==='fire'&&!confirm('Fire (atık) olarak kaydedilsin mi?'))return;
  const label=(reason==='fire'?'🔥 Fire: ':'✔ Kullanıldı: ')+it.name;
  try{
    if((it.qty||1)>1){ // birden fazla şişe: sadece 1 adet düşer, kart kalır
      const q=it.qty;
      const lref=await addDoc(collection(db,'log'),{name:it.name,cat:it.cat,qty:1,reason,at:Date.now(),by:who(),itemId:it.id,partial:true});
      await updateDoc(doc(db,'items',it.id),{qty:q-1});
      toast(label+' (1 adet, '+(q-1)+' kaldı)',async()=>{await updateDoc(doc(db,'items',it.id),{qty:q});await deleteDoc(lref)},12000);return}
    const d=snap(it);
    const lref=await addDoc(collection(db,'log'),{name:it.name,cat:it.cat,qty:it.qty,reason,at:Date.now(),by:who(),itemId:it.id,item:d});
    await deleteDoc(doc(db,'items',it.id));if(editId===it.id)resetForm();
    toast(label,async()=>{await setDoc(doc(db,'items',it.id),d);await deleteDoc(lref)},12000)}catch(e){err(e)}}

const logData=l=>l.item?{...l.item}:{name:l.name,cat:l.cat||'Diğer',qty:l.qty||1,skt:'',barcode:'',added:Date.now(),by:'Geri getirildi'};
async function restoreLog(l,silent){
  try{
    if(l.partial){const cur=items.find(i=>i.id===l.itemId);
      if(cur)await updateDoc(doc(db,'items',l.itemId),{qty:(cur.qty||1)+(l.qty||1)});
      else await setDoc(doc(db,'items',l.itemId),{...logData(l),qty:l.qty||1})}
    else if(l.itemId)await setDoc(doc(db,'items',l.itemId),logData(l));
    else await addDoc(collection(db,'items'),logData(l));
    await deleteDoc(doc(db,'log',l.id));if(!silent)toast('↩ Geri getirildi: '+l.name)}catch(e){err(e)}}
function histFiltered(){const f=$('hf').value,q=norm($('hq').value.trim());
  return [...logs].sort((a,b)=>b.at-a.at).filter(l=>(f==='all'||l.reason===f)&&(!q||norm(l.name).includes(q)))}
function renderHist(){
  const L=histFiltered(),H=$('hist');H.textContent='';
  $('histN').textContent='('+logs.length+')';
  $('hall').textContent='↩ Listelenen '+L.length+' kaydın hepsini geri getir';$('hall').style.display=L.length>1?'':'none';
  if(!L.length){const e=document.createElement('div');e.className='m';e.style.color='var(--mute)';e.textContent='Kayıt yok.';H.appendChild(e);return}
  L.slice(0,150).forEach(l=>{
    const r=document.createElement('div');r.className='hrow';
    const t=document.createElement('div');t.style.minWidth='0';
    const n=document.createElement('div');n.className='n';n.textContent=l.name;
    const m=document.createElement('div');m.className='m';
    m.textContent=(l.reason||'')+' · '+new Date(l.at).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+(l.partial?' · 1 adet':'')+(l.by?' · '+l.by:'');
    t.append(n,m);
    const b=document.createElement('button');b.type='button';b.className='s good';b.textContent='↩ Geri getir';b.onclick=()=>restoreLog(l);
    r.append(t,b);H.appendChild(r)});
  if(L.length>150){const e=document.createElement('div');e.className='m';e.style.color='var(--mute)';e.textContent='İlk 150 kayıt gösteriliyor, aramayla daraltın.';H.appendChild(e)}}

$('hall').onclick=async()=>{
  const L=histFiltered();if(!L.length)return;
  if(!confirm(L.length+' kaydın hepsi listeye geri getirilsin mi?'))return;
  try{const P=L.filter(l=>l.partial),N=L.filter(l=>!l.partial);
    for(const l of P)await restoreLog(l,true);
    for(let k=0;k<N.length;k+=200){const b=writeBatch(db);
      N.slice(k,k+200).forEach(l=>{const ref=l.itemId?doc(db,'items',l.itemId):doc(collection(db,'items'));b.set(ref,logData(l));b.delete(doc(db,'log',l.id))});
      await b.commit()}
    toast('↩ '+L.length+' ürün geri getirildi')}catch(e){err(e)}};

async function lookup(code){
  barcode=code;$('bc').textContent='Barkod: '+code+' · aranıyor…';
  try{const s=await getDoc(doc(db,'barcodes',code));
    if(s.exists()){const d=s.data();$('name').value=d.name;if(allGroups().includes(d.cat))$('cat').value=d.cat;
      $('bc').textContent='Barkod: '+code+' · kayıtlı ürün bulundu';$('skt').focus();return}}catch(e){}
  try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,brands');
    const j=await r.json();
    if(j.status===1&&j.product&&(j.product.product_name||j.product.brands)){
      $('name').value=[j.product.brands&&j.product.brands.split(',')[0],j.product.product_name].filter(Boolean).join(' ');
      $('bc').textContent='Barkod: '+code+' · ürün bulundu, kontrol edin';$('skt').focus();return}}catch(e){}
  $('bc').textContent='Barkod: '+code+' · ürün bulunamadı, adını yazın (bir sonraki sefer hatırlanır)';$('name').focus();
}

// Ücretsiz günlük kota her model için ayrı: 3.8-flash ≈20/gün, flash-lite modelleri ≈500/gün. Biri dolunca sıradakine geçer.
const MODELS=['gemini-3.8-flash','gemini-3.5-flash-lite','gemini-3.1-flash-lite'];
const promptText=()=>`Bu, bir bar/restoran malzemesinin (şişe, kutu, paket) etiket fotoğrafı. Etiketten şunları oku ve SADECE JSON döndür:
{"name":"marka + ürün adı + hacim (yoksa null)",
"expiry":"son kullanma/tüketim tarihi (SKT, TETT, EXP, Best before) YYYY-MM-DD biçiminde (yoksa null)",
"production":"üretim tarihi (PRD, ÜRT) YYYY-MM-DD (yoksa null)",
"group":"şu listeden en uygunu: ${allGroups().join(', ')} (yoksa null)",
"match":"aşağıdaki MEVCUT ÜRÜN LİSTESİNDEN fotoğraftaki ürüne karşılık geleni listede yazdığı gibi AYNEN yaz; marka/çeşit/hacim açıkça uyuyorsa seç, emin değilsen null"}
Kurallar: Tarihler gün/ay/yıl sırasıdır (23/12/2028 = 2028-12-23). Bitişik 6 haneli GGAAYY biçimi de çok yaygındır: "170926 TETT:170327" demek üretim tarihi 17.09.2026, tavsiye edilen tüketim tarihi (TETT) 17.03.2027 demektir (170327 = 2027-03-17). TETT, SKT, EXP, Son Tüketim yazan tarih "expiry", ÜRT, PRD, Üretim yazan tarih "production" alanıdır. Sadece ay/yıl varsa ayın son gününü yaz. Üretim tarihini son kullanma tarihiyle karıştırma. Okuyamadığın bir şeyi uydurma, null yaz.
MEVCUT ÜRÜN LİSTESİ: ${items.map(i=>i.name).slice(0,700).join(' | ')}`;
function toJpeg(file,max=1280){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.85).split(',')[1])};
  img.onerror=()=>rej(new Error('Fotoğraf açılamadı'));img.src=u})}
const okDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&+d.slice(0,4)>=2000&&+d.slice(0,4)<=2100;
function note(msg,undo){const b=$('bc');b.textContent=msg+' ';
  if(undo){const u=document.createElement('button');u.type='button';u.className='s';u.textContent='↩ Geri al';
    u.onclick=async()=>{try{await undo();b.textContent='Geri alındı.'}catch(e){err(e)}};b.appendChild(u)}}
async function finalizePhoto(){
  const name=$('name').value.trim(),skt=$('skt').value,m=photoMatch&&items.find(i=>i.id===photoMatch);
  if(m){const old=m.skt||'';await updateDoc(doc(db,'items',m.id),{skt});resetForm();
    note('✅ '+m.name+' · SKT: '+fmt(pd(skt))+(old?' (eski: '+fmt(pd(old))+')':''),()=>updateDoc(doc(db,'items',m.id),{skt:old}));return}
  const rec={name,cat:$('cat').value,qty:Number($('qty').value)||1,skt,opened:'',life:'',barcode,added:Date.now(),by:who()};
  const ref=await addDoc(collection(db,'items'),rec);resetForm();
  note('✅ Yeni ürün eklendi: '+name+' · SKT: '+fmt(pd(skt)),()=>deleteDoc(ref));
}

$('photoBtn').onclick=()=>$('photoIn').click();
$('photoIn').onchange=async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  const b=$('photoBtn');b.disabled=true;$('bc').textContent='⏳ Fotoğraf okunuyor…';
  try{
    const data=await toJpeg(f);let out=null,last;
    for(const m of MODELS){try{
      const model=getGenerativeModel(ai,{model:m,generationConfig:{responseMimeType:'application/json'}});
      const r=await model.generateContent([promptText(),{inlineData:{data,mimeType:'image/jpeg'}}]);
      out=JSON.parse(r.response.text().replace(/```json|```/g,'').trim());break}catch(e){last=e}}
    if(!out)throw last;
    if(out.match){const m=items.find(i=>norm(i.name)===norm(out.match));if(m)photoMatch=m.id}
    const mi=photoMatch&&items.find(i=>i.id===photoMatch);
    if(mi)$('name').value=mi.name;
    else{if(out.name&&!$('name').value.trim())$('name').value=String(out.name).trim();
      if(out.group&&allGroups().includes(out.group))$('cat').value=out.group}
    if(okDate(out.expiry))$('skt').value=out.expiry;
    const name=$('name').value.trim(),skt=$('skt').value;
    if(editId)note('Alanlar dolduruldu, kontrol edip Güncelle\'ye basın.');
    else if(skt&&(name||photoMatch))await finalizePhoto();
    else if(skt)note('⚠ SKT okundu: '+fmt(pd(skt))+' · ürün adı bulunamadı: ön yüzü fotoğraflayın veya elle yazın.');
    else if(name)note('⚠ '+(photoMatch?'Eşleşti: ':'Ürün: ')+name+' · SKT bulunamadı: tarihin yazılı olduğu yüzü fotoğraflayın veya elle girin.');
    else note('⚠ Okunamadı, daha net/yakından çekin.');
  }catch(e){
    $('bc').textContent='Okunamadı: '+(e.message||e.code||e)+' (Firebase\'de AI Logic açık mı?)';
  }finally{b.disabled=false}
};

function toast(msg,undo,ms=9000){const t=$('toast');t.textContent='';const sp=document.createElement('span');sp.textContent=msg;t.appendChild(sp);
  if(undo){const u=document.createElement('button');u.type='button';u.textContent='↩ Geri al';
    u.onclick=async()=>{try{await undo();toast('Geri alındı.')}catch(e){err(e)}};t.appendChild(u)}
  t.style.display='flex';clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none'},ms)}
const EXP_PROMPT=`Bu fotoğrafta bir ürünün (şişe, kutu, paket) üzerinde tarih yazıyor olabilir. SADECE JSON döndür:
{"expiry":"son kullanma/tüketim tarihi (SKT, TETT, EXP, Best before, Use by) YYYY-MM-DD biçiminde, yoksa null","production":"üretim tarihi (PRD, ÜRT) YYYY-MM-DD, yoksa null"}
Kurallar: Tarihler gün/ay/yıl sırasıdır (23/12/2028 = 2028-12-23). Bitişik 6 haneli GGAAYY biçimi de çok yaygındır: "170926 TETT:170327" demek üretim tarihi 17.09.2026, tavsiye edilen tüketim tarihi (TETT) 17.03.2027 demektir (170327 = 2027-03-17). TETT, SKT, EXP, Son Tüketim yazan tarih "expiry", ÜRT, PRD, Üretim yazan tarih "production" alanıdır. Sadece ay/yıl varsa ayın son gününü yaz. Üretim tarihini son kullanma tarihiyle karıştırma; sadece üretim tarihi varsa expiry null olsun. Okuyamadığını uydurma.`;
async function askModel(prompt,data){let last;
  for(const m of MODELS){try{
    const model=getGenerativeModel(ai,{model:m,generationConfig:{responseMimeType:'application/json'}});
    const r=await Promise.race([model.generateContent([prompt,{inlineData:{data,mimeType:'image/jpeg'}}]),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('Zaman aşımı: yanıt gelmedi (App Check anahtarı tanıtıldı mı?)')),30000))]);
    return JSON.parse(r.response.text().replace(/```json|```/g,'').trim())}catch(e){last=e}}
  throw last}
function itemPhoto(it,mode){targetItem=it;targetMode=mode||'set';$('itemPhotoIn').click()}
$('itemPhotoIn').onchange=async ev=>{
  const f=ev.target.files[0];ev.target.value='';const it=targetItem,mode=targetMode;targetItem=null;targetMode='set';if(!f||!it)return;
  toast('⏳ '+it.name+': tarih okunuyor…',null,60000);
  try{
    const out=await askModel(EXP_PROMPT,await toJpeg(f));
    if(!okDate(out.expiry)){toast('⚠ '+it.name+': SKT okunamadı. Tarihin yazılı yerini daha net çekin veya elle girin.',null,10000);return}
    if(mode==='new'){
      const ref=await addDoc(collection(db,'items'),{name:it.name,cat:it.cat,qty:1,skt:out.expiry,code:it.code||'',unit:it.unit||'',barcode:it.barcode||'',added:Date.now(),by:who()});
      toast('✅ Yeni parti eklendi: '+it.name+' · SKT: '+fmt(pd(out.expiry)),()=>deleteDoc(ref),10000);return}
    const old=it.skt||'';
    await updateDoc(doc(db,'items',it.id),{skt:out.expiry});
    toast('✅ '+it.name+' · SKT: '+fmt(pd(out.expiry)),()=>updateDoc(doc(db,'items',it.id),{skt:old}),10000);
  }catch(e){toast('Okunamadı: '+(e.message||e.code||e),null,12000)}};

    await setDoc(doc(db,'staff',c.user.uid),{name,username:un,at:Date.now()});
    await signOut(sa);
    $('sn').value=$('su').value=$('sp').value='';alert(name+' eklendi. Kullanıcı adı: '+un+' · Şifre: '+pw);
  }catch(e){alert(e.code==='auth/email-already-in-use'?'Bu kullanıcı adı kullanılmış (silinmiş olsa bile). Başka bir ad deneyin.':'Hata: '+(e.code||e.message))}};

function sub(name,fn){return onSnapshot(collection(db,name),s=>fn(s.docs.map(d=>({id:d.id,...d.data()}))),err)}
onAuthStateChanged(auth,async u=>{
  me=u;unsubs.forEach(f=>f());unsubs=[];isAdmin=false;staffName='';
  if(u){
    isAdmin=!!u.email&&!u.email.endsWith(DOMAIN);
    if(!isAdmin){
      try{const s=await getDoc(doc(db,'staff',u.uid));
        if(!s.exists()){await signOut(auth);$('lmsg').textContent='Bu hesabın erişimi kapatılmış. Yöneticiye başvurun.';return}
        staffName=s.data().name}catch(e){await signOut(auth);return}
    }
  }
  $('login').style.display=u?'none':'block';$('app').style.display=u?'block':'none';
  $('staffBox').style.display=isAdmin?'':'none';
  if(!u)return;
  fillGroups();render();
  unsubs=[sub('items',a=>{items=a;$('st').textContent='Canlı · '+who()+(isAdmin?' (yönetici)':'');render()}),
    sub('groups',a=>{groups=a;fillGroups();render()}),sub('log',a=>{logs=a;renderHist()})];
  if(isAdmin)unsubs.push(sub('staff',a=>{staffList=a;renderStaff()}));
});
</script>
</body>
